[project]
name = "aurelio-pipeline"
version = "1.0.0"
description = "Pipeline de produção dos dicionários StarDict do Aurélio para o KOReader e o Readest — features 002 e 003"
requires-python = ">=3.12"
dependencies = [
    "pyglossary==5.4.1",
    "python-idzip==0.3.9",
]

[project.scripts]
aurelio-pipeline = "aurelio_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "coverage==7.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurelio_pipeline"]

[tool.pytest.ini_options]
markers = [
    "integracao: executa o código real do Readest (exige Node e o cache da conferência)",
]
